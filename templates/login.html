<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · AGROVISION Sistemas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
    <span class="topbar-logo">
        🌿 AGROVISION
        <span class="topbar-badge">Sistemas</span>
    </span>
</header>

<!-- CAJA DE AUTH -->
<div class="auth-wrap">
    <div class="auth-box">
        <form method="POST" action="{{ url_for('login') }}" class="auth-content">

            <p class="auth-title">Bienvenido al sistema</p>
            <p class="auth-sub">
                Ingresa con tus credenciales de <strong>AGROVISION Sistemas</strong>.
            </p>

            {% if error %}
            <div class="error-msg" id="msg-error">{{ error }}</div>
            {% endif %}

            <div class="form-group">
                <label for="correo">Correo corporativo</label>
                <input type="email" name="correo" id="correo" placeholder="usuario@agrovision.pe"
                       required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" name="password" id="password" placeholder="••••••••"
                       required autocomplete="current-password">
            </div>

            <a href="{{ url_for('olvide_contrasena') }}" class="forgot-link">
                ¿Olvidaste tu contraseña?
            </a>

            <button type="submit" id="btn-ingresar" class="btn-full">
                Ingresar al sistema
            </button>

        </form>

        <div class="auth-footer">
            🔒 Acceso restringido · Solo personal autorizado de AGROVISION
        </div>
    </div>
</div>

</body>
</html>
