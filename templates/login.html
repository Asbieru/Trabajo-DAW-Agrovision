<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · AGROVISION Sistemas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
    <span class="topbar-logo">
        🌿 AGROVISION
        <span class="topbar-badge">Sistemas</span>
    </span>
</header>

<!-- CAJA DE AUTH -->
<div class="auth-wrap">
    <div class="auth-box">
        <div class="auth-content">

            <p class="auth-title">Bienvenido al sistema</p>
            <p class="auth-sub">
                Ingresa con tus credenciales de <strong>AGROVISION Sistemas</strong>.
            </p>

            <!-- Mensaje de error -->
            <div class="error-msg" id="msg-error" style="display:none;"></div>

            <div class="form-group">
                <label for="correo">Correo corporativo</label>
                <input type="email" id="correo" placeholder="usuario@agrovision.pe"
                       required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••"
                       required autocomplete="current-password">
            </div>

            <a href="{{ url_for('olvide_contrasena') }}" class="forgot-link">
                ¿Olvidaste tu contraseña?
            </a>

            <button id="btn-ingresar" class="btn-full" onclick="hacerLogin()">
                Ingresar al sistema
            </button>

        </div>

        <div class="auth-footer">
            🔒 Acceso restringido · Solo personal autorizado de AGROVISION
        </div>
    </div>
</div>

<!-- URLs de Flask para script.js -->
<script>
var URL_INDEX        = '{{ url_for("index") }}';
var URL_API_LOGIN    = '{{ url_for("api_login") }}';
var URL_ERROR_500    = '{{ url_for("pagina_error_500") }}';
var URL_APROBACION   = '{{ url_for("aprobacion_proyectos") }}';
var URL_AUTH         = '/auth';
var URL_USUARIO_ME   = '{{ url_for("api_usuario_me") }}';
</script>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
