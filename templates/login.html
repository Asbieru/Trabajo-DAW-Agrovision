<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · AgroVisión Sistemas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
    <span class="topbar-logo">
        🌿 Agro<em>visión</em>
        <span class="topbar-badge">Sistemas</span>
    </span>
</header>

<!-- CAJA DE AUTH -->
<div class="auth-wrap">
    <div class="auth-box">

        <div class="auth-content">

            <p class="auth-title">Bienvenido al sistema</p>
            <p class="auth-sub">
                Ingresa con tus credenciales de <strong>AgroVisión Sistemas</strong>.
            </p>

            <!-- Mensaje de error si las credenciales son incorrectas -->
            {% if error %}
            <div class="error-msg">⚠️ {{ error }}</div>
            {% endif %}

            <!-- FORMULARIO LOGIN -->
            <form method="POST" action="{{ url_for('login') }}">

                <div class="form-group">
                    <label for="correo">Correo corporativo</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="usuario@agrovisioncorp.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="••••••••"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <!-- Enlace de recuperación debajo del campo contraseña -->
                <a href="{{ url_for('olvide_contrasena') }}" class="forgot-link">
                    ¿Olvidaste tu contraseña?
                </a>

                <button type="submit" class="btn-full">Ingresar al sistema</button>

            </form>

        </div>

        <!-- PIE -->
        <div class="auth-footer">
            🔒 Acceso restringido · Solo personal autorizado de AgroVisión
        </div>

    </div>
</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
