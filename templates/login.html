<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · AgroVisión Sistemas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
    <span class="topbar-logo">
        🌿 Agro<em>visión</em>
        <span class="topbar-badge">Sistemas</span>
    </span>
</header>

<!-- CAJA DE AUTH -->
<div class="auth-wrap">
    <div class="auth-box">

        <!-- TABS -->
        <div class="tabs">
            <button class="tab-btn activo" onclick="mostrarTab('login', this)">
                🔐 Iniciar sesión
            </button>
            <button class="tab-btn" onclick="mostrarTab('registro', this)">
                ✉️ Registrarse
            </button>
        </div>

        <!-- ── PANEL: LOGIN ── -->
        <div id="panel-login" class="tab-panel activo">
            <p class="auth-title">Bienvenido al sistema</p>
            <p class="auth-sub">
                Ingresa con tus credenciales de <strong>AgroVisión Sistemas</strong>.
            </p>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="correo-login">Correo corporativo</label>
                    <input
                        type="email"
                        id="correo-login"
                        name="correo"
                        placeholder="usuario@agrovisioncorp.com"
                        required
                        autocomplete="email"
                    >
                </div>
                <div class="form-group">
                    <label for="password-login">Contraseña</label>
                    <input
                        type="password"
                        id="password-login"
                        name="password"
                        placeholder="••••••••"
                        required
                        autocomplete="current-password"
                    >
                </div>
                <button type="submit" class="btn-full">Ingresar al sistema</button>
            </form>
        </div>

        <!-- ── PANEL: REGISTRO ── -->
        <div id="panel-registro" class="tab-panel">
            <p class="auth-title">Crear cuenta</p>
            <p class="auth-sub">
                Solo se aceptan correos con dominio
                <strong>@agrovisioncorp.com</strong>
            </p>

            <form method="POST" action="{{ url_for('registro') }}">
                <div class="form-group">
                    <label for="nombre-reg">Nombre completo</label>
                    <input
                        type="text"
                        id="nombre-reg"
                        name="nombre_completo"
                        placeholder="Ej. Renzo Carranza Hoyos"
                        required
                    >
                </div>
                <div class="form-group">
                    <label for="correo-reg">Correo corporativo</label>
                    <input
                        type="email"
                        id="correo-reg"
                        name="correo"
                        placeholder="usuario@agrovisioncorp.com"
                        required
                    >
                    <span class="form-hint">Debe terminar en @agrovisioncorp.com</span>
                </div>
                <div class="form-group">
                    <label for="password-reg">Contraseña</label>
                    <input
                        type="password"
                        id="password-reg"
                        name="password"
                        placeholder="Mínimo 6 caracteres"
                        required
                        minlength="6"
                    >
                </div>
                <div class="form-group">
                    <label for="password2-reg">Confirmar contraseña</label>
                    <input
                        type="password"
                        id="password2-reg"
                        name="password2"
                        placeholder="Repite tu contraseña"
                        required
                        minlength="6"
                    >
                </div>
                <button type="submit" class="btn-full">Crear cuenta</button>
            </form>
        </div>

        <!-- PIE -->
        <div class="auth-footer">
            🔒 Acceso restringido · Solo personal autorizado de AgroVisión
        </div>

    </div>
</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
