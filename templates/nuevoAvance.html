{% extends "base.html" %}
{% block title %}Nuevo Avance · {{ proyecto.nombre }}{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>📝 Registrar Avance</h1>
        <p>PR-{{ proyecto.id_proyecto }} · {{ proyecto.nombre }}</p>
    </div>
    <a class="btn btn-outline" href="{{ url_for('historial_avances', id_proyecto=proyecto.id_proyecto) }}">← Cancelar</a>
</div>

<div class="card" style="max-width: 820px; margin: 0 auto;">
    <div class="card-header">Datos del reporte de avance</div>
    <div class="card-body">

        <form action="{{ url_for('nuevo_avance', id_proyecto=proyecto.id_proyecto) }}" method="POST">

            <div class="form-grid form-section-spacing">

                <!-- Fecha -->
                <div class="form-group">
                    <label>Fecha de registro</label>
                    <input type="text" value="{{ hoy_mostrar }}" disabled
                           style="background-color: var(--gris-bg); color: var(--gris-texto); font-weight: 600;">
                </div>

                <!-- Autor -->
                <div class="form-group">
                    <label for="id_autor">Reportado por (Autor) *</label>
                    <select id="id_autor" name="id_autor" required>
                        <option value="">— Selecciona responsable —</option>
                        {% for u in usuarios %}
                            <option value="{{ u.id_usuario }}">{{ u.nombre_completo }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- % Avance en tiempo real -->
                <div class="form-group">
                    <label style="display:flex; align-items:center; justify-content:space-between;">
                        % de Avance automatizado
                        <button type="button" id="btn-refrescar-pct"
                                onclick="refrescarPorcentaje()"
                                style="background:none; border:none; cursor:pointer;
                                       color:var(--verde); font-size:0.8rem; padding:0;
                                       display:flex; align-items:center; gap:4px;">
                            🔄 <span>Actualizar</span>
                        </button>
                    </label>
                    <div style="display:flex; flex-direction:column; gap:8px;">
                        <!-- Badge numérico -->
                        <div style="display:flex; align-items:center; gap:10px;">
                            <span id="badge-pct" class="badge badge-verde"
                                  style="font-size:1rem; padding:6px 12px;">
                                {{ pct_calculado }}%
                            </span>
                            <span id="pct-estado-texto"
                                  style="font-size:0.78rem; color:var(--gris-texto);">
                                Basado en actividades del proyecto
                            </span>
                        </div>
                        <!-- Barra de progreso -->
                        <div style="background:var(--gris-borde); border-radius:20px;
                                    height:10px; overflow:hidden;">
                            <div id="barra-pct"
                                 style="height:100%; border-radius:20px;
                                        background:var(--verde);
                                        width:{{ pct_calculado }}%;
                                        transition: width 0.6s ease;"></div>
                        </div>
                    </div>
                </div>

                <!-- Salud del proyecto -->
                <div class="form-group">
                    <label for="estado_salud">Salud del proyecto *</label>
                    <select id="estado_salud" name="estado_salud" required>
                        <option value="a_tiempo">🟢 A tiempo (On track)</option>
                        <option value="en_riesgo">🟡 En riesgo (At risk)</option>
                        <option value="retrasado">🔴 Retrasado (Delayed)</option>
                    </select>
                </div>

            </div>

            <!-- Logros -->
            <div class="form-group form-section-spacing">
                <label for="logros_periodo"
                       style="display:flex; justify-content:space-between; align-items:center;">
                    ¿Qué se avanzó en este periodo? (Logros) *
                    <span id="contador-logros"
                          style="font-size:0.75rem; color:var(--gris-texto); font-weight:400;">
                        0 / 1000
                    </span>
                </label>
                <textarea id="logros_periodo" name="logros_periodo" rows="4" required
                          maxlength="1000"
                          oninput="actualizarContador('logros_periodo','contador-logros',1000)"
                          placeholder="Describe las tareas completadas o los hitos alcanzados..."></textarea>
            </div>

            <!-- Pendientes -->
            <div class="form-group form-section-spacing">
                <label for="pendientes_next"
                       style="display:flex; justify-content:space-between; align-items:center;">
                    ¿Cuáles son los siguientes pasos o bloqueos? (Opcional)
                    <span id="contador-pendientes"
                          style="font-size:0.75rem; color:var(--gris-texto); font-weight:400;">
                        0 / 600
                    </span>
                </label>
                <textarea id="pendientes_next" name="pendientes_next" rows="3"
                          maxlength="600"
                          oninput="actualizarContador('pendientes_next','contador-pendientes',600)"
                          placeholder="Riesgos detectados, dependencias o tareas inmediatas..."></textarea>
            </div>

            <div class="form-actions" style="margin-top:20px;">
                <button type="submit" class="btn btn-verde">💾 Guardar Reporte</button>
            </div>

        </form>
    </div>
</div>

<script>
const ID_PROYECTO = {{ proyecto.id_proyecto }};

// ── Refresca el % de avance desde la API ──────────────────────
function refrescarPorcentaje() {
    var btn  = document.getElementById('btn-refrescar-pct');
    var span = btn.querySelector('span');
    span.textContent = 'Cargando…';
    btn.disabled = true;

    fetch('/api/proyecto/' + ID_PROYECTO + '/porcentaje')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var pct = data.porcentaje;
            document.getElementById('badge-pct').textContent = pct + '%';
            document.getElementById('barra-pct').style.width  = pct + '%';

            // Color de la barra según el porcentaje
            var barra = document.getElementById('barra-pct');
            if (pct >= 75) {
                barra.style.background = 'var(--verde)';
            } else if (pct >= 40) {
                barra.style.background = 'var(--acento)';
            } else {
                barra.style.background = 'var(--rojo)';
            }

            document.getElementById('pct-estado-texto').textContent =
                'Actualizado hace un momento ✓';
        })
        .catch(function() {
            document.getElementById('pct-estado-texto').textContent =
                '⚠️ No se pudo actualizar';
        })
        .finally(function() {
            span.textContent = 'Actualizar';
            btn.disabled = false;
        });
}

// ── Contador de caracteres ────────────────────────────────────
function actualizarContador(idTextarea, idContador, max) {
    var len = document.getElementById(idTextarea).value.length;
    var contador = document.getElementById(idContador);
    contador.textContent = len + ' / ' + max;
    contador.style.color = len >= max * 0.9 ? 'var(--rojo)' : 'var(--gris-texto)';
}

// ── Auto-refresco cada 30 segundos ───────────────────────────
setInterval(function() {
    refrescarPorcentaje();
}, 30000);
</script>
{% endblock %}
